<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FundTrace — Bank Fund Flow Intelligence</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  {% block extra_head %}{% endblock %}
</head>
<body>

<div id="header">
  <div style="display: flex; align-items: center; gap: 40px;">
      <div class="logo">
        🔍 Fund<span class="dot">Trace</span>
      </div>
      <nav id="top-nav">
          <a href="/" class="{{ 'active' if request.path == '/' else '' }}">Dashboard</a>
          <a href="/graph" class="{{ 'active' if request.path == '/graph' else '' }}">Graph</a>
          <a href="/analytics" class="{{ 'active' if request.path == '/analytics' else '' }}">Analytics</a>
          <a href="/upload" class="{{ 'active' if request.path == '/upload' else '' }}">Upload</a>
      </nav>
  </div>
  <div style="display: flex; align-items: center; gap: 20px;">
      <div class="subtitle">Bank Fund Flow Intelligence Dashboard &nbsp;·&nbsp; Fraud Detection Engine</div>
      <button id="theme-toggle">☀️ Light Mode</button>
  </div>
</div>

{% block content %}{% endblock %}

<script>
    const toggleBtn = document.getElementById('theme-toggle');
    const htmlEl = document.documentElement;

    // Check localStorage
    const savedTheme = localStorage.getItem('fundtrace_theme') || 'dark';
    htmlEl.setAttribute('data-theme', savedTheme);
    updateBtnText(savedTheme);

    toggleBtn.addEventListener('click', () => {
        const currentTheme = htmlEl.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        htmlEl.setAttribute('data-theme', newTheme);
        localStorage.setItem('fundtrace_theme', newTheme);
        updateBtnText(newTheme);
    });

    function updateBtnText(theme) {
        toggleBtn.textContent = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    }
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
